name: 问题反馈
description: 反馈可复现的 SonarGameBar 问题
title: "[问题] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        提交前，请从日志中移除用户名、电脑名、绝对路径、证书和无关进程信息。
  - type: input
    id: gg-version
    attributes:
      label: SteelSeries GG 版本
    validations:
      required: true
  - type: dropdown
    id: sonar-mode
    attributes:
      label: Sonar 模式
      options:
        - Classic（经典）
        - Streamer（主播）
        - 不确定
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？你原本期望发生什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: sanitized-logs
    attributes:
      label: 已脱敏日志
      description: 请不要附加原始构建产物、证书、包文件或 Windows 事件日志导出。
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已移除私人电脑和用户信息。
          required: true
