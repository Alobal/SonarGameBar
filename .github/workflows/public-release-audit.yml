name: 构建、测试和公开发布审计

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit-build-test:
    runs-on: windows-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 扫描隐私数据和生成物
        shell: pwsh
        run: .\tools\Test-PublicRelease.ps1

      - name: 构建 Core
        shell: pwsh
        run: dotnet build .\SonarGameBar.Core\SonarGameBar.Core.csproj --configuration Debug

      - name: 构建 Bridge
        shell: pwsh
        run: dotnet build .\SonarGameBar.Bridge\SonarGameBar.Bridge.csproj --configuration Debug

      - name: 运行 Core 测试
        shell: pwsh
        run: dotnet run --project .\SonarGameBar.Core.Tests\SonarGameBar.Core.Tests.csproj --configuration Debug
